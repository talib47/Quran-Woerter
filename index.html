<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Eine schmale Spalte, zwei Reiter unten. Koranwörter voll vokalisiert in Amiri Quran, Arabisch im deutschen Text in Noto Naskh Arabic.
   Amiri Quran braucht viel Platz: Zeichen reichen bis 1,42 em über und 0,76 em unter die Grundlinie (gemessen an allen Wörtern der App).
   Deshalb haben alle arabischen Zeilen line-height ≥ 2 und unten zusätzlichen Abstand, damit nichts in den Text darunter ragt. */
:root{
  --bg:#F4F1E9; --surface:#FCFBF7; --ink:#1C2220; --muted:#5E6762; --line:#D9D3C5;
  --accent:#1E5A4C; --accent-ink:#FFFFFF; --accent-soft:#DDEAE4;
  --hl:#F3E4B8; --good:#2F7A4A; --bad:#A3392B; --warn:#9A6B12;
  --ar:"Amiri Quran","Noto Naskh Arabic","Geeza Pro",serif;
  --art:"Noto Naskh Arabic","Geeza Pro",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --bg:#111513; --surface:#1A201D; --ink:#E6ECE8; --muted:#9BA6A0; --line:#2E3733;
    --accent:#86C9B4; --accent-ink:#0D1A16; --accent-soft:#213530;
    --hl:#4A3F1E; --good:#6CC28B; --bad:#E58373; --warn:#D9AE55; }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#111513; --surface:#1A201D; --ink:#E6ECE8; --muted:#9BA6A0; --line:#2E3733;
  --accent:#86C9B4; --accent-ink:#0D1A16; --accent-soft:#213530;
  --hl:#4A3F1E; --good:#6CC28B; --bad:#E58373; --warn:#D9AE55; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0)}
.tin{max-width:40rem;margin:0 auto;height:48px;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-left,0px))}
.ttl{font-weight:650;font-size:1.05rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon:active{background:var(--accent-soft)}
.icon svg{width:22px;height:22px}
#app{max-width:40rem;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0)}
.tabs button{flex:1;max-width:14rem;border:0;background:none;padding:12px 0 14px;font-size:.95rem;color:var(--muted);font-weight:600}
.tabs button.on{color:var(--accent)}
.tabs.hide{display:none}
h1{font-size:1.5rem;margin:4px 0 14px;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.ar{font-family:var(--ar);direction:rtl;font-feature-settings:"calt","liga"}
.ai{font-family:var(--art);font-size:1.12em;line-height:normal;unicode-bidi:isolate}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);padding:12px 18px;font-weight:650;font-size:1rem;min-height:48px}
.btn:active{filter:brightness(.92)}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.nums{display:flex;gap:28px;margin:0 0 16px}
.nums b{display:block;font-size:2.2rem;line-height:1.1;font-weight:700}
.nums span{color:var(--muted);font-size:.9rem}
.line{margin:6px 2px;color:var(--muted);font-size:.92rem}
.line b{color:var(--ink);font-weight:650}
.sync{margin-top:22px;font-size:.85rem;color:var(--muted)}
.sync a,.link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font-size:inherit}
.sync textarea{width:100%;min-height:64px;margin:8px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font:.85rem ui-monospace,Menlo,monospace}
/* Üben */
.prog{display:flex;align-items:center;gap:10px;margin:-4px 0 12px}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.prog .n{font-size:.85rem;color:var(--muted);min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;min-height:52vh;margin-bottom:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;user-select:none;-webkit-user-select:none}
.card.front{cursor:pointer}
.card{position:relative}
.card.back{padding-top:30px}
.cic{position:absolute;top:8px;color:var(--muted);opacity:.7}
.cic.r{right:8px}
.cic.l{left:8px}
.cic.on{color:var(--accent);opacity:1}
.word{font-size:4.2rem;line-height:2;padding-bottom:.42em;margin:0}
.card.back .word{font-size:2.6rem}
.kind{font-size:.78rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:0}
.tapnote{margin-top:18px;font-size:.85rem;color:var(--muted)}
.mean{font-size:1.4rem;font-weight:650;margin:4px 0 6px;line-height:1.3}
.meta{font-size:.88rem;color:var(--muted);margin:2px 0}
.note{font-size:.92rem;margin:6px 0 0}
.ex{width:100%;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.vtext{font-size:1.65rem;line-height:2.3;padding-bottom:.3em;margin:0}
.hl{color:var(--accent);background:linear-gradient(transparent 40%,var(--hl) 40%,var(--hl) 88%,transparent 88%);padding:0 .08em}
.tr{font-size:.92rem;color:var(--muted);margin:6px 0 0;line-height:1.4}
.ref{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.play{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.acts{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;gap:10px;justify-content:center;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.acts .btn{flex:1;max-width:19rem;min-height:56px;font-size:1.05rem}
.acts .btn.no{background:var(--surface);color:var(--bad);border:1px solid var(--line)}
.card{transition:transform .2s}
.card[data-sw="r"]{box-shadow:0 0 0 3px var(--good)}
.card[data-sw="l"]{box-shadow:0 0 0 3px var(--bad)}
/* Suren */
.slist{list-style:none;margin:0;padding:0}
.slist li{margin-bottom:10px}
.srow{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px 12px;display:grid;grid-template-columns:2.2rem 1fr 6.5rem;align-items:center;column-gap:10px;row-gap:4px}
.srow .no{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;text-align:center}
.srow .nm{font-weight:650}
.srow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.srow .arn{font-size:1.45rem;line-height:2;padding-bottom:.42em;text-align:right}
.pct{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);text-align:right}
.mini{height:4px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:2/3}
.mini i{display:block;height:100%;background:var(--accent)}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 2px}
.shead h1{margin:0}
.shead .ar{margin-left:auto;font-size:1.5rem;line-height:2;padding-bottom:.42em}
.reader{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
.verse{padding:10px 0;border-bottom:1px solid var(--line)}
.verse:last-child{border-bottom:0}
.vline{font-size:1.85rem;line-height:2.35;padding-bottom:.3em;margin:0;text-align:right}
.w{cursor:pointer;border-radius:6px;padding:0 .05em;-webkit-tap-highlight-color:transparent}
.w:active,.w.sel{background:var(--accent-soft)}
.w.new{text-decoration-line:underline;text-decoration-style:dotted;text-decoration-color:var(--accent);text-decoration-thickness:2px;text-underline-offset:.5em}
.vno{display:inline-flex;align-items:center;justify-content:center;min-width:1.75em;height:1.75em;padding:0 .2em;margin:0 .25em;border:1.5px solid var(--accent);border-radius:999px;font-size:.5em;color:var(--accent);vertical-align:middle;cursor:pointer;font-family:var(--sans);line-height:1;font-weight:600}
.vtr{direction:ltr;text-align:left;font-size:.95rem;color:var(--muted);margin:2px 0 4px;display:flex;gap:10px;align-items:flex-start}
.vtr p{margin:0;flex:1}
.credits{margin-top:24px;font-size:.78rem;color:var(--muted);line-height:1.5}
.credits a{color:inherit}
/* Wortblatt */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top-left-radius:18px;border-top-right-radius:18px;box-shadow:0 -6px 24px rgba(0,0,0,.18);max-height:78vh;overflow:auto;padding:14px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:40rem;margin:0 auto}
.sgrip{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.shw{display:flex;align-items:center;gap:12px}
.shw .ar{font-size:2.4rem;line-height:2;padding-bottom:.42em;flex:1;text-align:right}
.gloss{font-size:1.25rem;font-weight:650;margin:2px 0 4px}
.form{font-size:.86rem;color:var(--muted);margin:0 0 8px}
.parts{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--line)}
.parts li{display:grid;grid-template-columns:5.2rem 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.parts .ar{font-size:1.5rem;line-height:2;padding-bottom:.42em;text-align:right}
.parts .pm{font-size:.95rem}
.parts .pm small{display:block;color:var(--muted);font-size:.8rem}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:middle}
.dot.on{background:var(--good)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:90vw;text-align:center}
.empty{text-align:center;padding:30px 10px}
@media (min-width:700px){ .word{font-size:4.8rem} .vline{font-size:2.1rem} }
</style>
</head>

/* ================= Geräte-Abgleich über GitHub (Datei fortschritt.json im Zweig "fortschritt") =================
   Anders als in den Uni-Apps wird pro Karte zusammengeführt: Es gilt jeweils die zuletzt bewertete Fassung einer Karte.
   So geht nichts verloren, auch wenn zwei Geräte zwischendurch ohne Abgleich geübt haben. */
const GH={repo:"https://api.github.com/repos/talib47/Quran-Woerter", file:"fortschritt.json", branch:"fortschritt", tokenKey:"qw-gh-token"};
GH.api=GH.repo+"/contents/"+GH.file;
let ghToken=null, remoteSha=null, syncStatus="aus", lastSync=null, pushTimer=null, pushing=false, pushAgain=false;
function initToken(){
  const m=location.hash.match(/[#&]t=([A-Za-z0-9_]+)/);
  if(m){ lsSet(GH.tokenKey,m[1]); try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){} }
  ghToken=lsGet(GH.tokenKey);
}
const ghHeaders=()=>({"Authorization":"Bearer "+ghToken,"Accept":"application/vnd.github+json"});
const b64enc=str=>btoa(unescape(encodeURIComponent(str)));
const b64dec=str=>decodeURIComponent(escape(atob(str.replace(/\n/g,""))));
function mergeStates(a,b){
  const out={v:1, cards:{}, days:{}, updated:Math.max(a.updated||0,b.updated||0)};
  const ac=a.cards||{}, bc=b.cards||{};
  for(const id of new Set([...Object.keys(ac),...Object.keys(bc)])){
    const x=ac[id], y=bc[id];
    out.cards[id]=!x?y:!y?x:((y.t||0)>(x.t||0)?y:x);
  }
  const ad=a.days||{}, bd=b.days||{};
  for(const d of new Set([...Object.keys(ad),...Object.keys(bd)])) out.days[d]=Math.max(ad[d]||0,bd[d]||0);
  return out;
}
async function ensureBranch(){
  const r=await fetch(GH.repo+"/git/ref/heads/"+GH.branch,{headers:ghHeaders(),cache:"no-store"});
  if(r.ok) return true;
  const base=await fetch(GH.repo,{headers:ghHeaders(),cache:"no-store"}); if(!base.ok) return false;
  const def=(await base.json()).default_branch||"main";
  const h=await fetch(GH.repo+"/git/ref/heads/"+def,{headers:ghHeaders(),cache:"no-store"}); if(!h.ok) return false;
  const sha=(await h.json()).object.sha;
  const c=await fetch(GH.repo+"/git/refs",{method:"POST",headers:ghHeaders(),body:JSON.stringify({ref:"refs/heads/"+GH.branch,sha})});
  return c.ok;
}
async function pull(){
  if(!ghToken) return null;
  const r=await fetch(GH.api+"?ref="+GH.branch+"&_="+Date.now(),{headers:ghHeaders(),cache:"no-store"});
  if(r.status===404){ remoteSha=null; return {}; }
  if(r.status===401||r.status===403){ syncStatus="schluessel"; return null; }
  if(!r.ok) throw new Error(r.status);
  const d=await r.json(); remoteSha=d.sha;
  return JSON.parse(b64dec(d.content));
}
async function push(){
  if(!ghToken) return;
  if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    for(let attempt=0;attempt<4;attempt++){
      const body={message:"Lernstand",branch:GH.branch,content:b64enc(JSON.stringify(state))};
      if(remoteSha) body.sha=remoteSha;
      const r=await fetch(GH.api,{method:"PUT",headers:ghHeaders(),body:JSON.stringify(body)});
      if(r.ok){ const d=await r.json(); remoteSha=d.content.sha; syncStatus="ok"; lastSync=new Date(); break; }
      if(r.status===401||r.status===403){ syncStatus="schluessel"; break; }
      if(r.status===404){ if(!(await ensureBranch())){ syncStatus="fehler"; break; } continue; }
      if(r.status===409||r.status===422){ const rem=await pull(); if(rem){ state=mergeStates(state,rem); norm(); lsSet(KEY,JSON.stringify(state)); } continue; }
      syncStatus="fehler"; break;
    }
  }catch(e){ syncStatus="fehler"; }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function schedulePush(){ if(!ghToken) return; clearTimeout(pushTimer); pushTimer=setTimeout(()=>{ pushTimer=null; push(); },1500); }
function flushPush(){ if(pushTimer){ clearTimeout(pushTimer); pushTimer=null; push(); } }
/* Holt den Stand der anderen Geräte und führt ihn mit dem eigenen zusammen. true = hier hat sich etwas geändert */
async function syncFromRemote(){
  if(!ghToken) return false;
  try{
    const remote=await pull();
    if(remote===null) return false;
    const before=JSON.stringify(state.cards), merged=mergeStates(state,remote);
    const changedHere=JSON.stringify(merged.cards)!==before;
    const remoteBehind=JSON.stringify(merged.cards)!==JSON.stringify(remote.cards||{})||JSON.stringify(merged.days)!==JSON.stringify(remote.days||{});
    state=merged; norm(); lsSet(KEY,JSON.stringify(state));
    if(remoteBehind) await push(); else { syncStatus="ok"; lastSync=new Date(); }
    return changedHere;
  }catch(e){ syncStatus="fehler"; }
  return false;
}
async function autoPull(){
  if(!ghToken||document.visibilityState!=="visible"||view==="round"||pushTimer||pushing) return;
  if(await syncFromRemote()) render();
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushPush(); else autoPull(); });
window.addEventListener("pagehide",flushPush);
window.addEventListener("focus",autoPull);
setInterval(autoPull,60000);

    fehler:"Abgleich gerade nicht möglich. Dein Stand bleibt hier gespeichert und wird später abgeglichen.",
    schluessel:"Der Schlüssel hat keinen Zugriff auf das Repository Quran-Woerter.",
    aus:"Wird abgeglichen …"}[syncStatus];
  return `<div class="sync"${syncStatus==="ok"||syncStatus==="aus"?"":` style="color:var(--bad)"`}>${msg} <button class="link" id="syNow">Jetzt abgleichen</button> · <button class="link" id="syOff">trennen</button></div>`;
}
function bindSync(){
  const o=$("#syOpen"); if(o) o.onclick=()=>{ syncOpen=true; render(); };
  const c=$("#syClose"); if(c) c.onclick=()=>{ syncOpen=false; render(); };
  const g=$("#tkGo");
  if(g) g.onclick=async()=>{
    const t=$("#tkIn").value.trim();
    if(!/^(github_pat_|ghp_)\w+$/.test(t)){ toast("Das sieht nicht nach einem GitHub-Schlüssel aus."); return; }
    lsSet(GH.tokenKey,t); ghToken=t; syncOpen=false; toast("Verbinde …");
    await syncFromRemote(); toast(syncStatus==="ok"?"Gerät verbunden":"Verbinden hat nicht geklappt"); render();
  };
  const n=$("#syNow"); if(n) n.onclick=async()=>{ flushPush(); await syncFromRemote(); toast(syncStatus==="ok"?"Abgeglichen":"Abgleich hat nicht geklappt"); render(); };
  const f=$("#syOff"); if(f) f.onclick=()=>{ if(!f.dataset.armed){ f.dataset.armed="1"; f.textContent="wirklich trennen?"; return; } lsDel(GH.tokenKey); ghToken=null; syncStatus="aus"; render(); };
}

/* ================= Wiederholungsplan: FSRS-5 (wie in Anki) =================

function fNextD(d,g){ const d1=d-FSRS_W[6]*(g-3)*(10-d)/9; return fClampD(FSRS_W[7]*fInitD(4)+(1-FSRS_W[7])*d1); }
function fRecallS(d,s,r,g){
  const hard=g===2?FSRS_W[15]:1, easy=g===4?FSRS_W[16]:1;
  return s*(1+Math.exp(FSRS_W[8])*(11-d)*Math.pow(s,-FSRS_W[9])*(Math.exp((1-r)*FSRS_W[10])-1)*hard*easy);
}
function fForgetS(d,s,r){
  const sf=FSRS_W[11]*Math.pow(d,-FSRS_W[12])*(Math.pow(s+1,FSRS_W[13])-1)*Math.exp((1-r)*FSRS_W[14]);
  return Math.min(sf,s);
}
const fShortS=(s,g)=>s*Math.exp(FSRS_W[17]*(g-3+FSRS_W[18]));
/* Neuer Zustand nach Bewertung g am Lerntag today (fuzz=false für die Vorschau auf den Knöpfen) */
function schedule(c,g,today,fuzz){
  let s,d;
  if(!c||!c.reps){ s=fInitS(g); d=fInitD(g); }
  else{
    const t=today-c.last;
    if(t<=0){ s=fShortS(c.s,g); d=fNextD(c.d,g); }
    else{
      const r=fR(t,c.s);
      s=g===1?fForgetS(c.d,c.s,r):fRecallS(c.d,c.s,r,g);
      d=fNextD(c.d,g);
    }
  }
  s=Math.max(0.1,s);
  let days=0;
  if(g>1){
    days=Math.min(FSRS_MAX,Math.max(1,Math.round(fIvl(s))));
    if(fuzz&&days>=4){ const f=Math.max(1,Math.round(days*0.05)); days+=Math.round((Math.random()*2-1)*f); }
  }
  return {s, d, last:today, due:today+days, reps:(c&&c.reps||0)+1,
    lapses:(c&&c.lapses||0)+(g===1&&c&&c.reps&&c.g>1?1:0), g, t:Date.now()};
}
function ivlLabel(days){
  if(days<=0) return "gleich";
  if(days===1) return "1 Tag";
  if(days<31) return days+" Tage";
  if(days<365){ const m=Math.round(days/30.4); return m===1?"1 Monat":m+" Monate"; }
  const y=Math.round(days/36.5)/10; return String(y).replace(".",",")+" Jahre";
}

/* ================= Karten ================= */
const CARDS=DATA.cards, WORDS=DATA.words;
const CARD_IX={}; CARDS.forEach((c,i)=>CARD_IX[c.id]=i);
const cst=id=>state.cards[id];
const isKnown=id=>{ const c=state.cards[id]; return !!c&&c.g>=2; };
const isSeen=id=>!!state.cards[id];
function dueCards(){
  const today=dayIdx();
  return CARDS.filter(c=>{ const s=cst(c.id); return s&&s.due<=today; })
    .sort((a,b)=>cst(a.id).due-cst(b.id).due||CARD_IX[a.id]-CARD_IX[b.id]);
}
const freshCards=()=>CARDS.filter(c=>!isSeen(c.id));
const knownCount=()=>CARDS.filter(c=>isKnown(c.id)).length;
function quranCoverage(){
  let n=0;
  for(const g of DATA.cov){ let ok=true; for(let i=1;i<g.length;i++){ if(!isKnown(CARDS[g[i]].id)){ ok=false; break; } } if(ok) n+=g[0]; }
  return n/DATA.total;
}
function nextDueInfo(){
  const today=dayIdx(); let min=Infinity, n=0;
  for(const c of CARDS){ const s=cst(c.id); if(s&&s.due>today){ if(s.due<min){ min=s.due; n=1; } else if(s.due===min) n++; } }
  return min===Infinity?null:{days:min-today, n};
}

/* ================= Runde =================
   Eine Runde: bis zu 20 fällige Karten, dazu neue – umso mehr, je weniger fällig ist.
   So richtet sich das Tempo von selbst danach, wie viel du übst. „Nochmal“ holt die Karte in dieser Runde wieder. */
let round=null;
function buildRound(){
  const due=dueCards().slice(0,20);
  const nNew=due.length===0?8:due.length<8?5:due.length<15?3:0;
  const fresh=freshCards().slice(0,nNew);
  if(!due.length&&!fresh.length) return null;
  const q=due.map(c=>c.id), step=fresh.length?Math.max(1,Math.floor(q.length/fresh.length)):1;
  fresh.forEach((c,i)=>q.splice(Math.min(q.length,i*(step+1)+1),0,c.id));
  return {q, i:0, flip:false, done:0, fresh:fresh.length, again:{}};
}
function startRound(){
  round=buildRound();
  if(!round){ render(); return; }
  go("round");
}
function flipCard(){
  if(!round||round.flip) return;
  round.flip=true; renderRound();
}
/* Zwei Bewertungen: gewusst (FSRS „Gut“) oder nicht gewusst („Nochmal“). Neue Karte „Kenne ich“ = „Einfach“, ohne Aufdecken. */
function grade(g){
  if(!round) return;
  const id=round.q[round.i], today=dayIdx();
  state.cards[id]=schedule(state.cards[id],g,today,true);
  const dk=dayKey(); state.days[dk]=(state.days[dk]||0)+1;
  save();
  if(g===1){ round.again[id]=(round.again[id]||0)+1; round.q.splice(Math.min(round.q.length,round.i+4),0,id); }
  round.done++; round.i++; round.flip=false; round.ex=false;
  if(round.i>=round.q.length){ view="done"; render(); }
  else { renderRound(); window.scrollTo(0,0); }
}

/* ================= Ansichten ================= */
function renderHome(){
  const due=dueCards().length, fresh=freshCards().length, today=state.days[dayKey()]||0;
  let hero;
  if(due||fresh){
    hero=`<div class="block"><div class="nums"><div><b>${due}</b><span>fällig</span></div><div><b>${fresh}</b><span>neu</span></div></div>
      <button class="btn wide" id="go">${today?"Weiter üben":"Üben"}</button></div>`;
  } else {
    const nx=nextDueInfo();
    hero=`<div class="block empty"><b>Alles erledigt.</b><p class="muted small" style="margin:6px 0 0">${nx?`Nächste Wiederholung ${nx.days===1?"morgen":"in "+nx.days+" Tagen"} (${nx.n} ${nx.n===1?"Karte":"Karten"}).`:""} Weitere Suren kommen als Nächstes dazu.</p></div>`;
  }
  $("#app").innerHTML=`${hero}
    ${today?`<p class="line">Heute: <b>${today}</b> ${today===1?"Karte":"Karten"}</p>`:""}
    <p class="line">Gelernt: <b>${knownCount()}</b> von ${CARDS.length} Karten</p>
    <p class="line">Koran: Du kennst <b>${pct(quranCoverage())}</b> aller Wörter</p>
    ${syncBox()}
    <p class="muted" style="font-size:.75rem;margin-top:18px">Stand 23.10. 17:28</p>`;
  const g=$("#go"); if(g) g.onclick=startRound;
  bindSync();
}
function verseHTML(vk,hiWord){
  return DATA.verses[vk].w.map(wi=>`<span${wi===hiWord?' class="hl"':""}>${esc(WORDS[wi].t)}</span>`).join(" ");
}
const SND_SVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>`;
const VERSE_SVG=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 11h16M4 16h10"/></svg>`;
function renderRound(){
  const id=round.q[round.i], c=CARDS[CARD_IX[id]], s=cst(id);
  const total=round.q.length, isNew=!s;
  const head=`<div class="prog"><div class="bar"><i style="width:${Math.round(round.i/total*100)}%"></i></div><span class="n">${round.i+1} / ${total}</span>
    <button class="icon" id="endR" aria-label="Runde beenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>`;
  const affix=c.k==="Vorsilbe"||c.k==="Endung";
  const tag=affix?`<div class="kind">${c.k}</div>`:isNew?`<div class="kind" style="color:var(--accent)">neu</div>`:"";
  if(!round.flip){
    $("#app").innerHTML=`${head}<div class="card front" id="card"><p class="ar word">${esc(c.ar)}</p>${tag}</div>
      <div class="acts">${isNew?`<button class="btn ghost" id="known">Kenne ich</button>`:""}<button class="btn" id="flip">Aufdecken</button></div>`;
    $("#flip").onclick=flipCard;
    const k=$("#known"); if(k) k.onclick=()=>grade(4);
  } else {
    const w=WORDS[c.ex], vk=w.l.split(":").slice(0,2).join(":"), v=DATA.verses[vk];
    const meta=[c.r?`Wurzel <span class="ai">${esc(c.r)}</span>`:"", c.pr?`Gegenwart <span class="ai">${esc(c.pr)}</span>`:"", c.st?`Stamm ${c.st}`:""].filter(Boolean).join(" · ");
    $("#app").innerHTML=`${head}<div class="card back" id="card">
      <button class="icon cic r" id="pW" aria-label="Wort anhören">${SND_SVG}</button>
      <button class="icon cic l${round.ex?" on":""}" id="exT" aria-label="Vers zeigen">${VERSE_SVG}</button>
      <p class="ar word">${esc(c.ar)}</p>${affix?`<div class="kind">${c.k}</div>`:""}
      <div class="mean">${mix(c.de)}</div>
      ${meta?`<div class="meta">${meta}</div>`:""}
      ${c.no?`<div class="meta">${mix(c.no)}</div>`:""}
      ${round.ex?`<div class="ex"><p class="ar vtext">${verseHTML(vk,c.ex)}</p>
        <div class="ref">${vk} · ${esc(w.g)} <button class="link" id="pV">▶ Vers</button></div>
        ${v.tr?`<p class="tr">${esc(v.tr)}</p>`:""}</div>`:""}
      </div>
      <div class="acts"><button class="btn no" id="g1">Nicht gewusst</button><button class="btn" id="g3">Gewusst</button></div>`;
    $("#pW").onclick=e=>{ e.stopPropagation(); playWord(w.l); };
    const pv=$("#pV"); if(pv) pv.onclick=()=>playVerse(vk);
    $("#exT").onclick=e=>{ e.stopPropagation(); round.ex=!round.ex; renderRound(); };
    $("#g1").onclick=()=>grade(1); $("#g3").onclick=()=>grade(3);
  }
  bindSwipe($("#card"));
  $("#endR").onclick=()=>{ round=null; AUD.pause(); go("home"); };
}
/* Wischen: vorne in jede Richtung = aufdecken, hinten rechts = gewusst, links = nicht gewusst. Tippen dreht die Karte hin und her. */
function bindSwipe(el){
  let x0=null, y0=0, dx=0;
  el.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; el.style.transition="none"; },{passive:true});
  el.addEventListener("touchmove",e=>{ if(x0===null) return; dx=e.touches[0].clientX-x0; const dy=e.touches[0].clientY-y0;
    if(Math.abs(dx)>Math.abs(dy)){ el.style.transform=`translateX(${dx*0.6}px) rotate(${dx/40}deg)`; el.dataset.sw=dx>40?"r":dx<-40?"l":""; } },{passive:true});
  el.addEventListener("touchend",()=>{ if(x0===null) return; x0=null; el.style.transition=""; el.style.transform=""; delete el.dataset.sw;
    if(Math.abs(dx)<70) return;
    if(!round.flip) flipCard(); else grade(dx>0?3:1); });
  el.addEventListener("click",e=>{ if(Math.abs(dx)>=10||e.target.closest("button")) return; round.flip=!round.flip; renderRound(); });
}
function renderDone(){
  const r=round||{done:0,fresh:0}, more=buildRound();
  $("#app").innerHTML=`<div class="block empty"><b style="font-size:1.2rem">Runde geschafft</b>
    <p class="muted" style="margin:6px 0 16px">${r.done} ${r.done===1?"Abfrage":"Abfragen"}${r.fresh?`, davon ${r.fresh} neue ${r.fresh===1?"Karte":"Karten"}`:""}.</p>
    ${more?`<button class="btn wide" id="more">Noch eine Runde</button><div style="height:10px"></div>`:""}
    <button class="btn ghost wide" id="fin">Fertig</button></div>
    <p class="line">Koran: Du kennst <b>${pct(quranCoverage())}</b> aller Wörter</p>`;
  const m=$("#more"); if(m) m.onclick=startRound;
  $("#fin").onclick=()=>{ round=null; go("home"); };
}
document.addEventListener("keydown",e=>{
  if(view!=="round"||!round||e.metaKey||e.ctrlKey||e.altKey) return;
  if(!round.flip&&(e.key===" "||e.key==="Enter")){ e.preventDefault(); flipCard(); }
  else if(round.flip&&(e.key==="ArrowRight"||e.key===" "||e.key==="2")){ e.preventDefault(); grade(3); }
  else if(round.flip&&(e.key==="ArrowLeft"||e.key==="1")){ e.preventDefault(); grade(1); }
});

/* ================= Suren lesen ================= */
const SURA_WORDS={};
for(const vk in DATA.verses){ const s=+vk.split(":")[0]; (SURA_WORDS[s]=SURA_WORDS[s]||[]).push(...DATA.verses[vk].w); }
const wordKnown=wi=>WORDS[wi].c.every(ci=>isKnown(CARDS[ci].id));
function suraCoverage(n){ const ws=SURA_WORDS[n]||[]; return ws.length?ws.filter(wordKnown).length/ws.length:0; }
let curSura=null, openVerses={};
function renderSuras(){
  const rows=DATA.suras.map(s=>{ const c=suraCoverage(s.n);
    return `<li><button class="srow" data-n="${s.n}"><span class="no">${s.n}</span>
      <span class="nm">${esc(s.name)}<small>${esc(s.de)} · ${s.v} Verse</small></span>
      <span class="ar arn">${esc(s.ar)}</span>
      <span></span><span class="mini"><i style="width:${Math.round(c*100)}%"></i></span><span class="pct">${pct0(c)}</span></button></li>`; }).join("");
  $("#app").innerHTML=`<ul class="slist">${rows}</ul>
    <p class="muted small">Der Prozentwert zeigt, wie viele Wörter der Sure du schon vollständig kennst.</p>
    <div class="credits">Koranwörter und Formanalyse: <a href="https://corpus.quran.com">Quranic Arabic Corpus</a> (Universität Leeds, GNU GPL), korrigierte Fassung von <a href="https://github.com/mustafa0x/quran-morphology">quran-morphology</a>.
      Übersetzung: A. S. F. Bubenheim und N. Elyas (<a href="https://quranenc.com">quranenc.com</a>).
      Rezitation: Mahmoud Khalil Al-Husary (<a href="https://everyayah.com">everyayah.com</a>), Wörter einzeln: quran.com.</div>`;
  document.querySelectorAll(".srow").forEach(b=>b.onclick=()=>{ curSura=+b.dataset.n; openVerses={}; go("sura"); });
}
function renderSura(){
  const s=DATA.suras.find(x=>x.n===curSura); if(!s){ go("suras"); return; }
  let html=`<div class="shead"><h1>${esc(s.name)}</h1><span class="muted small">${pct0(suraCoverage(s.n))} bekannt</span><span class="ar">${esc(s.ar)}</span></div>
    <p class="muted small" style="margin:0 0 12px">Wort antippen: Bedeutung · Versnummer: Übersetzung</p><div class="reader">`;
  for(let a=1;a<=s.v;a++){
    const vk=s.n+":"+a, v=DATA.verses[vk];
    const words=v.w.map(wi=>`<span class="w${wordKnown(wi)?"":" new"}" data-w="${wi}">${esc(WORDS[wi].t)}</span>`).join(" ");
    html+=`<div class="verse"><p class="ar vline">${words} <span class="vno" data-v="${vk}">${arNum(a)}</span></p>
      ${openVerses[vk]?`<div class="vtr"><p>${esc(v.tr)}</p><button class="btn ghost sm" data-pv="${vk}">▶ Vers</button></div>`:""}</div>`;
  }
  $("#app").innerHTML=html+"</div>";
  document.querySelectorAll(".w").forEach(el=>el.onclick=()=>openWord(+el.dataset.w,el));
  document.querySelectorAll(".vno").forEach(el=>el.onclick=()=>{ const k=el.dataset.v; openVerses[k]=!openVerses[k]; renderSura(); });
  document.querySelectorAll("[data-pv]").forEach(el=>el.onclick=()=>playVerse(el.dataset.pv));
}
/* Wortblatt: Bedeutung an dieser Stelle, Formangabe, Bestandteile mit ihren Karten */
function openWord(wi,el){
  closeSheet();
  if(el) el.classList.add("sel");
  const w=WORDS[wi];
  const parts=w.c.map(ci=>{ const c=CARDS[ci], k=isKnown(c.id);
    return `<li><span class="ar">${esc(c.ar)}</span><span class="pm"><span class="dot${k?" on":""}"></span>${mix(c.de)}
      <small>${[c.k,c.r?"Wurzel "+c.r:"",`${c.f.toLocaleString("de-DE")}× im Koran`,k?"gelernt":isSeen(c.id)?"in Wiederholung":"noch nicht gelernt"].filter(Boolean).map(mix).join(" · ")}</small></span></li>`; }).join("");
  const shade=document.createElement("div"); shade.className="shade"; shade.id="shade";
  const sh=document.createElement("div"); sh.className="sheet"; sh.id="sheet"; sh.setAttribute("role","dialog");
  sh.innerHTML=`<div class="in"><div class="sgrip"></div>
    <div class="shw"><button class="btn ghost sm" id="pWs" aria-label="Wort anhören">▶</button><span class="ar">${esc(w.t)}</span></div>
    <div class="gloss">${esc(w.g)}</div>
    ${w.d?`<div class="form">${esc(w.d)}</div>`:""}
    <ul class="parts">${parts}</ul>
    <p class="ref" style="margin:10px 0 0">${w.l.split(":").slice(0,2).join(":")} · Wort ${w.l.split(":")[2]}</p></div>`;
  document.body.appendChild(shade); document.body.appendChild(sh);
  shade.onclick=closeSheet;
  $("#pWs").onclick=()=>playWord(w.l);
}
function closeSheet(){
  const a=$("#sheet"), b=$("#shade"); if(a) a.remove(); if(b) b.remove();
  document.querySelectorAll(".w.sel").forEach(x=>x.classList.remove("sel"));
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

/* ================= Navigation und Start ================= */
let view="home";
const TITLES={home:"Üben", round:"Üben", done:"Üben", suras:"Suren", sura:""};
function go(v){ closeSheet(); view=v; render(); window.scrollTo(0,0); }
function render(){
  $("#ttl").textContent=view==="sura"?"Suren":TITLES[view];
  $("#back").hidden=view!=="sura";
  $("#tabs").classList.toggle("hide",view==="round");
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===(view==="sura"?"suras":view==="round"||view==="done"?"home":view)));
  ({home:renderHome, round:renderRound, done:renderDone, suras:renderSuras, sura:renderSura})[view]();
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ if(view==="round") round=null; go(b.dataset.v); });
$("#back").onclick=()=>go("suras");
initToken();
render();
if(ghToken) syncFromRemote().then(changed=>{ if(view!=="round") render(); });

/* ================= Selbst aktualisieren =================
   GitHub Pages liefert die Seite bis zu 10 Minuten aus dem Zwischenspeicher, und die Home-Bildschirm-App
   hält sie noch länger. Deshalb fragt die App beim Öffnen und beim Zurückkehren die aktuelle Fassung ab
   (am Zwischenspeicher vorbei) und lädt sich neu, wenn es eine neuere gibt. */
const BUILD="20261023172848";
async function checkUpdate(){
  if(view==="round") return;
  try{
    const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"}); if(!r.ok) return;
    const m=(await r.text()).match(/const BUILD="(\d+)"/);
    if(m&&m[1]>BUILD&&sessionStorage.getItem("qw-reload")!==m[1]){
      sessionStorage.setItem("qw-reload",m[1]); flushPush();
      location.replace(location.pathname+"?v="+m[1]);
    }
  }catch(e){}
}
checkUpdate();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
